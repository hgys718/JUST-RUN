<style>
  @font-face{font-family:"FuturaXBC";src:url("assets/futura.otf") format("opentype");font-weight:normal;font-style:normal}
  :root{
    --bg:#070308; --panel:#141417; --panel2:#1c1c20; --field:#0d0d10;

  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono);overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px 28px 72px 28px}
  body.wide #stage{padding-right:318px}
  #cv{display:block;box-shadow:0 0 0 1px #1a1a1f, 0 30px 80px rgba(0,0,0,.6);background:#000}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(7,3,8,.82);z-index:30;font-size:12px;letter-spacing:.14em;color:var(--hi)}
  #drop.on{display:flex}
  #drop div{border:1px dashed #555;padding:28px 40px}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:var(--bg);font-size:11px;letter-spacing:.16em;color:var(--dim)}

  #panel{position:fixed;top:12px;right:12px;width:292px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);
    border:1px solid #2b2b31;border-radius:3px;font-size:10.5px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.5);scrollbar-width:thin;scrollbar-color:#333 transparent}
  #panel.hidden{display:none}
  .topbtn{display:block;width:calc(100% - 8px);margin:4px;height:22px;border:0;border-radius:2px;background:var(--btn);color:#141417;
    font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  .topbtn:hover{background:#dedee2}
  .topbtn.sec{background:#2c2c32;color:var(--txt)}
  .topbtn.sec:hover{background:#38383f}
  .btnrow{display:flex}
  .btnrow .topbtn{width:auto;flex:1}
  .fold{border-top:1px solid #222227}
  .fh{display:flex;justify-content:space-between;align-items:center;height:24px;padding:0 8px;background:var(--panel2);cursor:pointer;
    text-transform:uppercase;letter-spacing:.08em;color:var(--txt);user-select:none}
  .fh i{font-style:normal;color:#666;font-size:9px;letter-spacing:-1px}
  .fold.closed .fb{display:none}

  .row{display:grid;grid-template-columns:96px 1fr;align-items:center;min-height:24px;padding:0 6px 0 12px;gap:6px}
  .row.full{grid-template-columns:1fr;padding:4px 6px 4px 12px}

  .ctl{display:flex;align-items:center;gap:6px;min-width:0}

  input[type=range]::-webkit-slider-runnable-track{height:1px;background:#4a4a52}
  input[type=range]::-moz-range-track{height:1px;background:#4a4a52}

  select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%);
    background-position:calc(100% - 9px) 8px,calc(100% - 5px) 8px;background-size:4px 4px;background-repeat:no-repeat;padding-right:16px}
  textarea{height:auto;min-height:104px;padding:6px;resize:vertical;line-height:1.5;text-transform:uppercase}

  #transport{position:fixed;left:28px;bottom:20px;height:30px;display:flex;align-items:center;gap:10px;font-size:10.5px;z-index:10}

<script>
"use strict";
/* =====================================================================
   JUST RUN / JUST RAN — locked motion-poster builder
   Locked: typeface (Futura Std Extra Bold Condensed, 140px), leading,
   alignment, tagline + logo animations and their placement, timing,
   palettes, glow, grain, vignette.
   Editable: background image + its heat mapping, headline copy, size.
   ===================================================================== */

const CLIPS = { logo:"assets/logo.mp4", vline:"assets/vline.mp4", hline:"assets/hline.mp4" };
const SAMPLES = {
  bedroom: {label:"SAMPLE · COFFEE", src:"assets/sample-coffee.jpg"},
  runner:  {label:"SAMPLE · WAITING", src:"assets/sample-waiting.jpg"},
};

/* asset crops, in the 1920×1080 source-comp coordinates of each clip */
const CROP = { logo:[144,110,1648,876], vline:[584,236,760,606], hline:[192,384,1536,314] };

/* layouts measured from the reference posters (base sizes) */
const LAYOUT = {
  h:{ W:1920, H:1080,
      logo:{s:.20, c:[960,972]},  line:{asset:"hline", s:.30, c:[960,94]},
      text:{align:"left",   x:107, size:150, lead:129, track:-30, cy:540, maxW:1706, maxH:665},
      burn:"snap",
      sample:"bedroom",
      copy:"WARMEST SPOT IN\nMY APARTMENT?\nUNDER THE BLANKET.\nWHICH IS EXACTLY\nTHE PROBLEM" },
  v:{ W:1080, H:1920,
      logo:{s:.15, c:[540,1792]}, line:{asset:"vline", s:.25, c:[540,149]},
      text:{align:"center", x:540, size:150, lead:129, track:-30, cy:960, maxW:1000, maxH:1375},
      burn:"slow",
      sample:"runner",
      copy:"THE CITY'S\nBEEN STEAMING\nSINCE 1882.\nYOUR TURN." },
};
/* id, label, layout family, W, H, element scale k (vertical family only) */
const FORMATS = [
  ["h",  "1920 × 1080 · 16:9","h",1920,1080,1],
  ["v",  "1080 × 1920 · 9:16",  "v",1080,1920,1],
  ["p34","1080 × 1440 · 3:4",            "v",1080,1440,1],
  ["p45","1080 × 1350 · 4:5",            "v",1080,1350,.94],
  ["sq", "1080 × 1080 · 1:1",            "v",1080,1080,.84],
];

const PAL = {
  cold:[[0,"#000003"],[.18,"#02040e"],[.34,"#0a1a3c"],[.46,"#2a5aa8"],[.56,"#5a8cc8"],[.64,"#6aaed8"],[.7,"#3cec6a"],[.78,"#46ff4e"],[.88,"#b8ff60"],[.95,"#f0ffb0"],[1,"#ffffff"]],
  hot:[[0,"#04020c"],[.18,"#06052e"],[.34,"#0a0c9a"],[.46,"#1a14f4"],[.56,"#6a12c4"],[.64,"#d0183c"],[.72,"#fa2410"],[.8,"#ff6a14"],[.88,"#ffc23c"],[.95,"#fff2b0"],[1,"#fffdf4"]],
  type:[[0,"#260e5c"],[.22,"#4a14a0"],[.4,"#a020b0"],[.52,"#e8287a"],[.62,"#ff4a3a"],[.72,"#ff8a2a"],[.82,"#ffd050"],[.91,"#fff4c8"],[1,"#ffffff"]],
};

const FPS=30, DUR=6, FRAMES=180;
const LOCKDEF={tagStyle:"auto", tagSize:1, logoSize:1};
const IMGDEF={zoom:1, ix:0, iy:0, soft:.25, lo:0, hi:1, gamma:1, invert:false};
const P = { fmt:"h", preview:"auto", copy:{h:LAYOUT.h.copy, v:LAYOUT.v.copy}, sample:"bedroom", ...LOCKDEF, ...IMGDEF };
const FMT=()=>FORMATS.find(f=>f[0]===P.fmt);
const orient=()=>FMT()[2];
/* Vertical-family layouts are derived from the 1080×1920 reference:
   tagline keeps its top margin, logo keeps its bottom margin, headline stays
   centred on the canvas; everything scales by k on shorter canvases. */
/* visible content extents of each clip (source-comp y), used to anchor them:
   tagline keeps its top edge, logo keeps its bottom edge when resized */
const EXT={hline:[392,687], vline:[244,833], logo:[118,975]};
function L(){
  const [,,fam,W,H,k]=FMT(), base=LAYOUT[fam];
  const asset = P.tagStyle==="auto" ? (fam==="h"?"hline":"vline") : P.tagStyle;
  const tagS = (fam==="h" ? (asset==="hline"?.30:.25) : .25*k) * P.tagSize;
  const logoS= (fam==="h" ? .20 : .15*k) * P.logoSize;
  const tagTop = fam==="h" ? 50 : 75*k, logoBot = fam==="h" ? 1059 : H-63*k;
  const [t0,t1]=EXT[asset], [l0,l1]=EXT.logo;
  const tagBottom=tagTop+tagS*(t1-t0), logoTop=logoBot-logoS*(l1-l0), pad=25*k;
  const text = fam==="h" ? {...base.text} : {align:"center", x:540, size:150*k, lead:129*k, track:-30, maxW:1000};
  text.cy=H/2; text.availTop=tagBottom+pad; text.availBot=logoTop-pad; text.maxH=Math.max(60,text.availBot-text.availTop);
  return {...base, W, H,
    logo:{s:logoS, c:[W/2, logoBot-logoS*(l1-540)]},
    line:{asset, s:tagS, c:[W/2, tagTop-tagS*(t0-540)]},
    text};
}
const OUT=()=>({W:L().W, H:L().H});

/* ------------------------------ GL ------------------------------- */
const cv=document.getElementById("cv");
const gl=cv.getContext("webgl2",{preserveDrawingBuffer:true,antialias:false,premultipliedAlpha:false});
if(!gl){ document.body.innerHTML='<p style="padding:40px;font:12px monospace;color:#ccc">This tool needs WebGL2 — open it in a current Chrome, Edge, Safari or Firefox.</p>'; throw new Error("no webgl2"); }

const VS=`#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;
const FS=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uScale; uniform float uS;
uniform sampler2D tBg, tM0, tM1, tM2, tLut, tA, tB;
uniform vec4 uARect, uBRect;
uniform float uBgT, uLo, uHi, uGamma, uInv;
uniform vec4 uTBox; uniform vec2 uTOrg;
uniform float uTProg, uTSoft, uTMax, uFrame;
out vec4 o;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+7.1; a*=.5; } return s; }
vec3 lut(float x, float row){ return texture(tLut, vec2(clamp(x,0.,1.)*(255./256.)+.5/256., (row+.5)/3.)).rgb; }
float sweep(vec2 p, vec4 box, vec2 org, float prog, float soft){
  vec2 sz=max(box.zw-box.xy, vec2(1.));
  vec2 d=(p-box.xy)/sz - org;
  float dist=length(d*vec2(.55,1.));
  dist += (fbm(p/uS*5.5+3.7)-.5)*.5;
  float front=prog*(1.+soft+.45)-.25;
  return clamp((front-dist)/soft, 0., 1.);
}
vec4 keyed(sampler2D t, vec4 r, vec2 p){
  vec2 q=(p-r.xy)/r.zw;
  if(q.x<0.||q.y<0.||q.x>1.||q.y>1.) return vec4(0.);
  vec3 c=texture(t,q).rgb;
  float a=clamp(max(c.r,max(c.g,c.b))/.3,0.,1.);
  return vec4(clamp(c/max(a,1e-3),0.,1.), a);
}
void main(){
  vec2 p=vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y);
  vec2 uv=p/uRes;
  float lum=dot(texture(tBg,uv).rgb, vec3(.299,.587,.114));
  float h=clamp((lum-uLo)/max(uHi-uLo,1e-3),0.,1.);
  h=pow(h,uGamma); h=mix(h,1.-h,uInv);
  vec3 col=mix(lut(h,0.), lut(h,1.), uBgT);
  vec2 q=uv-.5; q.x*=uRes.x/uRes.y;
  float r=length(q)/length(vec2(.5*uRes.x/uRes.y,.5));
  col*=.42+.58*smoothstep(1.12,.38,r);
  /* headline */
  float sharp=texture(tM0,uv).r, b1=texture(tM1,uv).r, b2=texture(tM2,uv).r;
  float T=(b2>0.002)? sweep(p,uTBox,uTOrg,uTProg,uTSoft)*uTMax : 0.;
  /* heat lives inside the letterforms only: cool rim at the edge, hot core,
     crisp glyph edges, no halo into the gaps between letters */
  float depth=smoothstep(.5,.99,b1);
  float v=T*mix(.68,1.,sqrt(depth));
  col=mix(col,lut(v,2.),sharp);
  /* tagline + logo (pre-rendered, luma-keyed) */
  vec4 A=keyed(tA,uARect,p); col=mix(col,A.rgb,A.a);
  vec4 Bv=keyed(tB,uBRect,p); col=mix(col,Bv.rgb,Bv.a);
  /* grain */
  vec2 gp=floor(p/(uScale*1.4));
  float g=hash(gp+vec2(uFrame*17.13,uFrame*7.77))+hash(gp*1.31+vec2(uFrame*3.1,uFrame*11.9))-1.;
  col+=g*.085;
  o=vec4(clamp(col,0.,1.),1.);
}`;
function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(prog,"a"); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U={}; ["uRes","uScale","uS","tBg","tM0","tM1","tM2","tLut","tA","tB","uARect","uBRect","uBgT","uLo","uHi","uGamma","uInv","uTBox","uTOrg","uTProg","uTSoft","uTMax","uFrame"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
function mkTex(unit){ const t=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255])); return t; }
const TX={bg:mkTex(0),m0:mkTex(1),m1:mkTex(2),m2:mkTex(3),lut:mkTex(4),a:mkTex(5),b:mkTex(6)};
[["tBg",0],["tM0",1],["tM1",2],["tM2",3],["tLut",4],["tA",5],["tB",6]].forEach(([n,i])=>gl.uniform1i(U[n],i));
function upload(unit,tex,src){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src); }

/* ---------------------------- helpers ---------------------------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;};
const easeOut=x=>1-Math.pow(1-clamp(x),2);
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
(function buildLut(){
  const rows=[PAL.cold,PAL.hot,PAL.type], d=new Uint8Array(256*3*4);
  rows.forEach((stops,r)=>{ const cs=stops.map(s=>[s[0],hex2rgb(s[1])]);
    for(let i=0;i<256;i++){ const x=i/255; let k=0; while(k<cs.length-2&&x>cs[k+1][0])k++;
      const [x0,c0]=cs[k],[x1,c1]=cs[k+1], t=clamp((x-x0)/Math.max(1e-6,x1-x0));
      for(let c=0;c<3;c++) d[(r*256+i)*4+c]=Math.round(c0[c]+(c1[c]-c0[c])*t); d[(r*256+i)*4+3]=255; } });
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D,TX.lut);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,256,3,0,gl.RGBA,gl.UNSIGNED_BYTE,d);
})();

function boxBlurR(img,w,h,r){
  r=Math.max(0,Math.round(r)); if(!r) return;
  const src=img.data, a=new Float32Array(w*h), b=new Float32Array(w*h);
  for(let i=0;i<w*h;i++) a[i]=src[i*4];
  for(let pass=0;pass<3;pass++){ const inv=1/(2*r+1);
    for(let y=0;y<h;y++){ const o=y*w; let acc=0;
      for(let x=-r;x<=r;x++) acc+=a[o+clamp(x,0,w-1)];
      for(let x=0;x<w;x++){ b[o+x]=acc*inv; acc+=a[o+Math.min(w-1,x+r+1)]-a[o+Math.max(0,x-r)]; } }
    for(let x=0;x<w;x++){ let acc=0;
      for(let y=-r;y<=r;y++) acc+=b[clamp(y,0,h-1)*w+x];
      for(let y=0;y<h;y++){ a[y*w+x]=acc*inv; acc+=b[Math.min(h-1,y+r+1)*w+x]-b[Math.max(0,y-r)*w+x]; } } }
  for(let i=0;i<w*h;i++) src[i*4]=a[i];
}
function blurred(srcCanvas,down,radius){

/* ------------------------- scene building ------------------------ */
let RS=1, RW=0, RH=0, bgImage=null, uploaded=false;
const BOX={t:[0,0,1,1]};
let fitNote="";

function resize(forExport){
  const o=OUT();
  RS = forExport||P.preview==="full" ? 1 : P.preview==="half" ? .5 : Math.min(1,Math.sqrt(2.2e6/(o.W*o.H)));
  RW=Math.max(2,Math.round(o.W*RS)); RH=Math.max(2,Math.round(o.H*RS));

}
function buildBg(){
  const c=document.createElement("canvas"); c.width=RW; c.height=RH; const x=c.getContext("2d");
  x.fillStyle="#000"; x.fillRect(0,0,RW,RH);
  if(bgImage){
    const iw=bgImage.width, ih=bgImage.height, s=Math.max(RW/iw,RH/ih)*P.zoom;
    const dw=iw*s, dh=ih*s, dx=(RW-dw)/2+P.ix*RW*.5, dy=(RH-dh)/2+P.iy*RH*.5;
    const blurPx=P.soft*Math.sqrt(RW*RH)*.012;
    if("filter" in x){ x.filter=`grayscale(1) blur(${blurPx.toFixed(2)}px)`; x.drawImage(bgImage,dx,dy,dw,dh); x.filter="none"; }
    else{ const k=1+P.soft*6, t=document.createElement("canvas"); t.width=Math.ceil(RW/k); t.height=Math.ceil(RH/k);
      t.getContext("2d").drawImage(bgImage,dx/k,dy/k,dw/k,dh/k); x.imageSmoothingQuality="high"; x.drawImage(t,0,0,RW,RH); }
  }

}
function buildMasks(){
  const lay=L(), sc=RW/lay.W;                 // base-layout px → render px
  const m=document.createElement("canvas"); m.width=RW; m.height=RH;
  const x=m.getContext("2d"); x.fillStyle="#000"; x.fillRect(0,0,RW,RH);
  const lines=P.copy[orient()].toUpperCase().replace(/\r/g,"").split("\n");
  while(lines.length>1 && !lines[lines.length-1].trim()) lines.pop();
  const t=lay.text;
  let size=t.size, lead=t.lead;
  const hasLS="letterSpacing" in x;
  const lw=(l,sz)=>{ if(hasLS) x.letterSpacing="0px"; return x.measureText(l).width/sc + t.track/1000*sz*Math.max(0,[...l].length-1); };
  const drawLine=(l,px,py,sz)=>{ const tr=t.track/1000*sz*sc;
    if(hasLS){ x.letterSpacing=tr+"px"; x.fillText(l,px,py); x.letterSpacing="0px"; return; }
    let cx=px; const ch=[...l]; ch.forEach((c,i)=>{ x.fillText(c,cx,py); const pair=ch.slice(i,i+2).join(""); const kernAdv = i<ch.length-1 ? x.measureText(pair).width - x.measureText(ch[i+1]).width : x.measureText(c).width; cx+=kernAdv+tr; }); };
  x.font=`${size*sc}px FuturaXBC`;
  const widest=Math.max(1,...lines.map(l=>lw(l,size)));
  const capH=(x.measureText("H").actualBoundingBoxAscent||size*.76*sc)/sc;
  const blockH=(lines.length-1)*lead+capH;
  let f=Math.min(1, t.maxW/widest, t.maxH/blockH);
  fitNote = f<.999 ? `Copy is longer than the reference layout — set at ${Math.round(size*f)}px instead of ${Math.round(size)}px to fit.` : "";
  size*=f; lead*=f;
  x.font=`${size*sc}px FuturaXBC`;
  const cap=capH*f, bh=(lines.length-1)*lead+cap;
  let top=t.cy-bh/2;               // centred on canvas, like the references…
  if(top<t.availTop) top=t.availTop; // …nudged only if the lockup would collide
  if(top+bh>t.availBot) top=Math.max(t.availTop, t.availBot-bh);
  x.fillStyle="#ff0000"; x.textBaseline="alphabetic"; x.textAlign="left";
  let bx0=1e9,bx1=-1e9;
  lines.forEach((l,i)=>{ const w=lw(l,size); const lx=t.align==="left"? t.x : t.x-w/2;
    if(l.trim()){ bx0=Math.min(bx0,lx); bx1=Math.max(bx1,lx+w); }
    drawLine(l,lx*sc,(top+cap+i*lead)*sc,size); });
  if(bx0>bx1){ bx0=t.x; bx1=t.x+1; }
  BOX.t=[bx0*sc, top*sc, bx1*sc, (top+bh+size*.12)*sc];
  upload(1,TX.m0,m);
  const S=Math.sqrt(RW*RH);
  upload(2,TX.m1,blurred(m,2,.0105*S));
  upload(3,TX.m2,blurred(m,4,.011*S));
  const n=document.getElementById("fitNote"); if(n){ n.textContent=fitNote; n.style.display=fitNote?"block":"none"; }
}
function rectFor(name,place){
  const [cx0,cy0,cw,ch]=CROP[name], lay=L(), sc=RW/lay.W, s=place.s;
  const ox=place.c[0]-s*960, oy=place.c[1]-s*540;   // comp is 1920×1080, anchor at centre
  return [(ox+s*cx0)*sc, (oy+s*cy0)*sc, s*cw*sc, s*ch*sc];
}

/* ------------------------- asset videos -------------------------- */
const VID={};
/* clips are fetched whole and played from memory so frame-accurate seeking
   never waits on the network during export */
async function makeVideo(name){
  const r=await fetch(CLIPS[name]); if(!r.ok) throw new Error(`asset ${name}: HTTP ${r.status}`);
  const url=URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:"video/mp4"}));
  return new Promise((res,rej)=>{
  const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.loop=true; v.preload="auto";
  v.src=url;
  v.addEventListener("loadeddata",()=>res(v),{once:true}); v.addEventListener("error",()=>rej(new Error("asset "+name)),{once:true});
  v.load(); }); }
function seek(v,t){ return new Promise(res=>{
  const target=Math.min(DUR-.5/FPS, t+.5/FPS);
  let done=false; const fin=()=>{ if(done) return; done=true; res(); };
  v.addEventListener("seeked",()=>{ if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(()=>fin()); setTimeout(fin,60); },{once:true});
  setTimeout(fin,1500);
  v.currentTime=target; }); }
const activeVids=()=>[VID.logo, VID[L().line.asset]];

/* ----------------------------- timing ---------------------------- */
/* snap: heats over ~1.4s (same pace as the tagline / logo clips), reaches
   ~80% and then keeps creeping hotter until the last frame */
const BURN={snap:{start:1.3,end:2.7,soft:.6,org:[.35,1.05]}, slow:{start:.3,end:5.85,soft:.9,org:[.5,1.05]}};
function state(t){
  const b=BURN[L().burn], u=(t-b.start)/(b.end-b.start);
  let tp;
  if(L().burn==="snap") tp=ease(u);
  else { const a=.27, hold=.45; tp = u<=0?0 : u<a ? .55*easeOut(u/a) : u<hold ? .55 : .55+.45*ease((u-hold)/(1-hold)); }
  const tmax = L().burn==="slow" ? .96 : .8+.2*easeOut((t-b.end)/(DUR-b.end));
  return {bgT:clamp(t/2), tp, soft:b.soft, org:b.org, tmax};
}
function draw(t){
  const st=state(t), lay=L();
  upload(5,TX.a,VID.logo); upload(6,TX.b,VID[lay.line.asset]);
  gl.useProgram(prog);
  gl.uniform2f(U.uRes,RW,RH); gl.uniform1f(U.uScale,RW/OUT().W); gl.uniform1f(U.uS,Math.sqrt(RW*RH));
  gl.uniform4fv(U.uARect,rectFor("logo",lay.logo)); gl.uniform4fv(U.uBRect,rectFor(lay.line.asset,lay.line));
  gl.uniform1f(U.uBgT,st.bgT); gl.uniform1f(U.uLo,P.lo); gl.uniform1f(U.uHi,P.hi); gl.uniform1f(U.uGamma,P.gamma); gl.uniform1f(U.uInv,P.invert?1:0);
  gl.uniform4fv(U.uTBox,BOX.t); gl.uniform2fv(U.uTOrg,st.org);
  gl.uniform1f(U.uTProg,st.tp); gl.uniform1f(U.uTSoft,st.soft); gl.uniform1f(U.uTMax,st.tmax);
  gl.uniform1f(U.uFrame,Math.floor(t*FPS)%997);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* --------------------------- playback ---------------------------- */
let T=0, playing=true, busy=false, seekPending=false;
const scrub=document.getElementById("scrub"), timeEl=document.getElementById("time"), playBtn=document.getElementById("play");
function setPlaying(v){
  playing=v; playBtn.textContent=v?"❚❚":"▶";
  const vs=activeVids();
  if(v){ vs.forEach(x=>{ x.currentTime=T; x.play().catch(()=>{}); }); }
  else { vs.forEach(x=>x.pause()); syncSeek(); }
}
async function syncSeek(){ if(seekPending) return; seekPending=true; const t=T; await Promise.all(activeVids().map(v=>seek(v,t))); seekPending=false; if(Math.abs(t-T)>1e-4 && !playing) syncSeek(); }
playBtn.onclick=()=>setPlaying(!playing);
scrub.oninput=()=>{ T=+scrub.value*DUR; if(playing) setPlaying(false); else syncSeek(); };
function loop(){
  if(!busy){
    if(playing){
      const master=VID[L().line.asset]; T=master.currentTime;
      const lg=VID.logo; if(Math.abs(lg.currentTime-T)>.08) lg.currentTime=T;
    }
    draw(T);
    scrub.value=T/DUR; timeEl.textContent=`${T.toFixed(2)} / ${DUR.toFixed(2)}`;
  }
  requestAnimationFrame(loop);
}
async function rebuild(what="all"){

}

let bt=0; const bgSoon=()=>{ clearTimeout(bt); bt=setTimeout(()=>rebuild("bg"),40); };

const modal=document.getElementById("modal"), mTitle=document.getElementById("mTitle"), mMsg=document.getElementById("mMsg"),
      mBar=document.getElementById("mBar"), mVid=document.getElementById("mVid"), mSave=document.getElementById("mSave");
let lastExport=null;
function showModal(title,msg){ modal.classList.add("on"); mTitle.textContent=title; mMsg.textContent=msg; mBar.style.width="0"; mVid.style.display="none"; mSave.style.display="none"; }

(async()=>{ try{ if(window.claude&&window.claude.use) downloads=await window.claude.use("downloads"); }catch(e){} })();
async function offer(blob,name,isVideo){
  lastExport={blob,name,isVideo};

    try{ await downloads.save({filename:name,data:blob}); mMsg.textContent=`Saved ${name}.`; return; }
    catch(e){ mMsg.textContent = e&&e.code==="declined" ? "Save declined." : "Couldn’t save from this view."; mSave.style.display="inline-block"; }
  } else {
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove();
    mMsg.textContent=`Saved ${name} to your downloads.`; mSave.style.display="inline-block"; mSave.textContent="Download again";
  }

}
const fname=ext=>{ const slug=(P.copy[orient()].split("\n")[0]||"poster").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,32)||"poster";
  const o=OUT(); return `just-ran-${slug}-${o.W}x${o.H}.${ext}`; };
async function pickCodec(w,h,bitrate){
  for(const codec of ["avc1.640034","avc1.640033","avc1.640032","avc1.640028","avc1.4d0033","avc1.42e033"])
    for(const hw of ["prefer-hardware","no-preference","prefer-software"]){
      const cfg={codec,width:w,height:h,bitrate,framerate:FPS,hardwareAcceleration:hw,avc:{format:"avc"}};
      try{ const r=await VideoEncoder.isConfigSupported(cfg); if(r.supported) return r.config; }catch(e){} }
  return null;
}
async function exportMP4(){
  if(busy) return; busy=true; const wasPlaying=playing; if(playing) setPlaying(false);
  const o=OUT(); showModal("Rendering MP4",`${o.W}×${o.H} · 6s · 30fps`);
  const prevT=T;
  try{
    resize(true); buildBg(); buildMasks();
    const bitrate=Math.round(Math.min(80e6,o.W*o.H*FPS*.32));
    const cfg=("VideoEncoder" in window)? await pickCodec(o.W,o.H,bitrate) : null;
    let blob, ext="mp4";
    if(cfg){
      const target=new Mp4Muxer.ArrayBufferTarget();
      const muxer=new Mp4Muxer.Muxer({target,video:{codec:"avc",width:o.W,height:o.H,frameRate:FPS},fastStart:"in-memory",firstTimestampBehavior:"offset"});
      let err=null; const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{err=e;}}); enc.configure(cfg);
      for(let i=0;i<FRAMES;i++){
        if(err) throw err;
        const t=i/FPS; await Promise.all(activeVids().map(v=>seek(v,t)));
        draw(t); gl.finish();
        const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
        enc.encode(vf,{keyFrame:i%FPS===0}); vf.close();
        while(enc.encodeQueueSize>4) await new Promise(r=>setTimeout(r,4));
        mBar.style.width=(100*(i+1)/FRAMES)+"%"; mMsg.textContent=`Frame ${i+1} / ${FRAMES} · ${o.W}×${o.H}`;
      }
      await enc.flush(); if(err) throw err; enc.close(); muxer.finalize();
      blob=new Blob([target.buffer],{type:"video/mp4"});
    } else {
      ext="webm"; mMsg.textContent="This browser can’t encode MP4 — recording WebM in real time…";
      const mime=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
      if(!mime) throw new Error("No video encoder available in this browser.");
      const rec=new MediaRecorder(cv.captureStream(FPS),{mimeType:mime,videoBitsPerSecond:bitrate}); const chunks=[];
      rec.ondataavailable=e=>e.data.size&&chunks.push(e.data); const done=new Promise(r=>rec.onstop=r);
      const vs=activeVids(); await Promise.all(vs.map(v=>seek(v,0))); rec.start(); vs.forEach(v=>v.play());
      await new Promise(res=>{ const step=()=>{ const t=vs[1].currentTime; if(t>=DUR-1/FPS||vs[1].ended){ res(); return; } draw(t); mBar.style.width=(100*t/DUR)+"%"; requestAnimationFrame(step); }; step(); });
      rec.stop(); vs.forEach(v=>v.pause()); await done; blob=new Blob(chunks,{type:"video/webm"});
    }
    mTitle.textContent="Render complete"; mBar.style.width="100%";
    await offer(blob,fname(ext),true);
  }catch(e){ console.error(e); mTitle.textContent="Render failed"; mMsg.textContent=String(e&&e.message||e); }
  finally{ busy=false; T=prevT; await rebuild("all"); if(wasPlaying) setPlaying(true); else syncSeek(); }
}
async function exportPNG(){
  if(busy) return; busy=true; const wasPlaying=playing; if(playing) setPlaying(false);
  const o=OUT(); showModal("Saving frame",`${o.W}×${o.H} at ${T.toFixed(2)}s`);
  try{
    resize(true); buildBg(); buildMasks(); await Promise.all(activeVids().map(v=>seek(v,T))); draw(T); gl.finish();
    const blob=await new Promise(r=>cv.toBlob(r,"image/png")); mBar.style.width="100%"; mTitle.textContent="Frame ready";
    await offer(blob,fname("png").replace(".png",`-${T.toFixed(2)}s.png`),false);
  }catch(e){ mMsg.textContent=String(e.message||e); }
  finally{ busy=false; await rebuild("all"); if(wasPlaying) setPlaying(true); }
}

  if(e.code==="Space"){ e.preventDefault(); setPlaying(!playing); }
  if(e.key==="h"||e.key==="H"){ panel.classList.toggle("hidden"); layoutStage(); }
  if(e.key==="ArrowRight"){ if(playing) setPlaying(false); T=Math.min(DUR-1/FPS,T+1/FPS); syncSeek(); }
  if(e.key==="ArrowLeft"){ if(playing) setPlaying(false); T=Math.max(0,T-1/FPS); syncSeek(); }
});

(async()=>{
  try{
    const [lg,vl,hl]=await Promise.all([makeVideo("logo"),makeVideo("vline"),makeVideo("hline")]);
    VID.logo=lg; VID.vline=vl; VID.hline=hl;
  }catch(e){ document.getElementById("loading").textContent="COULDN’T LOAD THE LOGO / TAGLINE ANIMATIONS IN THIS BROWSER."; throw e; }
  if(innerHeight>innerWidth*1.1) P.fmt="v";
  P.sample=L().sample;
  buildUI();
  bgImage=await loadImg(SAMPLES[P.sample].src);
  await rebuild("all");
  document.getElementById("loading").remove();
  if(location.hash==="#paused") setPlaying(false); else setPlaying(true);
  requestAnimationFrame(loop);
})();
window.__poster={P,draw,rebuild,state,VID,seek,activeVids,setT:async t=>{ T=t; if(playing) setPlaying(false); await Promise.all(activeVids().map(v=>seek(v,t))); },switchFormat};
</script>
